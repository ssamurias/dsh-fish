<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" width="1400" height="1160" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#f4f2ee"/>
    </linearGradient>
    <linearGradient id="stanceFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowStance" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="1160" fill="url(#bg)"/>

  <!-- ============ 标题 ============ -->
  <text x="48" y="66" font-size="40" font-weight="700" fill="#111827">认知是怎么长出来的</text>
  <text x="48" y="106" font-size="18" fill="#6b7280">五步循环：表态 → 撞上 → 落差 → 改写 → 回顾。走完一圈，一条判断变硬一点；两句话对不上，就长成一处矛盾。</text>
  <text x="48" y="132" font-size="18" fill="#6b7280">四个阶段按天推进、三个瓶颈要她自己走；三道瓶颈都真过之后，才开始长「立场清单」。</text>
  <line x1="48" y1="158" x2="1352" y2="158" stroke="#e5e7eb"/>

  <!-- ============ 左：输入 ============ -->
  <text x="48" y="200" font-size="16" font-weight="700" fill="#0d9488">她每天会撞上</text>
  <text x="48" y="220" font-size="12.5" fill="#9ca3af">这些不是设定，是发生的事</text>

  <g font-size="13.5" fill="#1f2937">
    <rect x="48" y="238" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="265">刷到一条视频（带评论区）</text>
    <rect x="48" y="292" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="319">评论区里别人写的一句话</text>
    <rect x="48" y="346" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="373">你问她的一句问题</text>
    <rect x="48" y="400" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="427">你说的和她记得的不一样</text>
    <rect x="48" y="454" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="481">她被拒绝、被顶回来</text>
    <rect x="48" y="508" width="248" height="44" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="535">久别之后重新说话</text>
  </g>

  <path d="M300 330 H 336" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M300 476 H 336" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- ============ 中：五步循环 ============ -->
  <rect x="340" y="188" width="672" height="420" rx="18" fill="#f0fdfa" stroke="#99f6e4"/>

  <g font-size="15" font-weight="700" fill="#0f766e">
    <rect x="360" y="212" width="290" height="72" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#soft)"/>
    <text x="380" y="242">① 表态</text>
    <text x="380" y="266" font-size="12" font-weight="400" fill="#6b7280">写下一条自己的判断（growth_commit）</text>

    <rect x="702" y="212" width="290" height="72" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#soft)"/>
    <text x="722" y="242">② 撞上</text>
    <text x="722" y="266" font-size="12" font-weight="400" fill="#6b7280">新视频、别人的话、你的一句反问</text>

    <rect x="702" y="346" width="290" height="72" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#soft)"/>
    <text x="722" y="376">③ 落差</text>
    <text x="722" y="400" font-size="12" font-weight="400" fill="#6b7280">发现两句话不能同时算数</text>

    <rect x="360" y="346" width="290" height="72" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#soft)"/>
    <text x="380" y="376">④ 改写</text>
    <text x="380" y="400" font-size="12" font-weight="400" fill="#6b7280">revise：指向被改掉的那一句（带 refs）</text>

    <rect x="360" y="480" width="290" height="72" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" filter="url(#soft)"/>
    <text x="380" y="510">⑤ 回顾</text>
    <text x="380" y="534" font-size="12" font-weight="400" fill="#6b7280">过几天问自己：现在还这么想吗</text>
  </g>

  <g fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" opacity="0.7">
    <path d="M654 248 H 696"/>
    <path d="M847 288 V 342"/>
    <path d="M696 382 H 654"/>
    <path d="M505 422 V 476"/>
    <path d="M360 516 H 346 V 248 H 352"/>
  </g>

  <text x="676" y="584" text-anchor="middle" font-size="12" fill="#0f766e">走完⑤再回到①：同一句可以再被撞一次，第二次回来会被要求「说清为什么没变，或者改一句」</text>

  <!-- ============ 右：一圈留下什么 ============ -->
  <text x="1352" y="200" font-size="16" font-weight="700" fill="#b45309" text-anchor="end">一圈走完会留下什么</text>
  <g font-size="12.5">
    <rect x="1036" y="214" width="316" height="82" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="1052" y="238" font-size="14" font-weight="700" fill="#92400e">一条判断</text>
    <text x="1052" y="260" fill="#78350f">下次摆出来只有一句话；提得越多越难被挤掉</text>
    <text x="1052" y="282" fill="#a16207">被验证过两次 → 标成「记得很牢」</text>

    <rect x="1036" y="308" width="316" height="82" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="1052" y="332" font-size="14" font-weight="700" fill="#92400e">一次改口</text>
    <text x="1052" y="354" fill="#78350f">旧的那句标成「被推翻」，新的那句顶上</text>
    <text x="1052" y="376" fill="#a16207">不改写历史，只追加一条（事件流只增不改）</text>

    <rect x="1036" y="402" width="316" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="1052" y="426" font-size="14" font-weight="700" fill="#991b1b">一道疤</text>
    <text x="1052" y="448" fill="#7f1d1d">明确拒绝 → 被顶回来 / 你因此难过 → 她后来还是让了</text>
    <text x="1052" y="470" fill="#b91c1c">永不折叠；同类情境先回引，逼她面对</text>
    <text x="1052" y="490" fill="#b91c1c">想通只能靠一次带 refs 的改写</text>

    <rect x="1036" y="514" width="316" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1052" y="538" font-size="14" font-weight="700" fill="#5b21b6">一处矛盾</text>
    <text x="1052" y="560" fill="#4c1d95">两句话不能同时算数，但一条都没删</text>
    <text x="1052" y="582" fill="#4c1d95">写进身份文档 → 她可以来问你哪个对</text>
    <text x="1052" y="602" fill="#6d28d9">想通之前，这处矛盾一直摆着</text>
  </g>

  <!-- ============ 四个阶段 ============ -->
  <line x1="48" y1="648" x2="1352" y2="648" stroke="#e5e7eb"/>
  <text x="48" y="686" font-size="17" font-weight="700" fill="#111827">四个阶段按天推进，三个瓶颈要她自己走</text>
  <text x="470" y="686" font-size="12.5" fill="#9ca3af">天数到了、门没过：兜底放行，但兜底不算真过；立场要三道门都真过。</text>

  <g font-size="12.5">
    <rect x="48" y="708" width="300" height="78" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="66" y="738" font-size="15.5" font-weight="700" fill="#0f766e">1 信任</text>
    <text x="66" y="764" fill="#6b7280">瓶颈：至少一条自己的判断</text>

    <rect x="378" y="708" width="300" height="78" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="396" y="738" font-size="15.5" font-weight="700" fill="#0f766e">2 自主</text>
    <text x="396" y="764" fill="#6b7280">瓶颈：真的拒绝过两件事</text>

    <rect x="708" y="708" width="300" height="78" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="726" y="738" font-size="15.5" font-weight="700" fill="#0f766e">3 主动</text>
    <text x="726" y="764" fill="#6b7280">瓶颈：两次推翻自己的判断</text>

    <rect x="1038" y="708" width="314" height="78" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <text x="1056" y="738" font-size="15.5" font-weight="700" fill="#0f766e">4 整合</text>
    <text x="1056" y="764" fill="#6b7280">瓶颈：回头看，发现自己变了</text>
  </g>

  <g stroke="#0d9488" stroke-width="1.6" fill="none" marker-end="url(#arrow)" opacity="0.6">
    <path d="M352 747 H 372"/>
    <path d="M682 747 H 702"/>
    <path d="M1012 747 H 1032"/>
  </g>

  <!-- 阶段 → 立场 的连线 -->
  <path d="M1195 790 V 838" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowStance)" opacity="0.75"/>
  <text x="1178" y="818" text-anchor="end" font-size="12.5" fill="#b45309">走完才有</text>

  <!-- ============ 立场（显眼的一块，不是底部一行字） ============ -->
  <rect x="48" y="846" width="1304" height="184" rx="18" fill="url(#stanceFill)" stroke="#5eead4" stroke-width="1.4"/>
  <rect x="48" y="846" width="9" height="184" rx="4" fill="#0d9488"/>

  <text x="88" y="892" font-size="24" font-weight="700" fill="#0f766e">三道瓶颈都真过之后长出来的：立场清单</text>
  <text x="88" y="920" font-size="13" fill="#0f766e">四个阶段到此为止，之后不再加阶段、也没有「通关」——往后一直变厚的就是这一张清单。</text>

  <g font-size="13">
    <text x="88" y="956" font-weight="700" fill="#115e59">什么算一条立场</text>
    <text x="88" y="980" fill="#134e4a">同一类事、两次说过一样的观点；</text>
    <text x="88" y="1002" fill="#134e4a">或者这件事上出现过疤（栽过一次）。</text>

    <text x="500" y="956" font-weight="700" fill="#115e59">它长什么样</text>
    <text x="500" y="980" fill="#134e4a">喜欢什么、绝不做哪几件事；</text>
    <text x="500" y="1002" fill="#134e4a">一条一句，不带次数、不带权重。</text>

    <text x="916" y="956" font-weight="700" fill="#115e59">怎么才不会被弄丢</text>
    <text x="916" y="980" fill="#134e4a">写进身份文档的核心段，不参与折叠；</text>
    <text x="916" y="1002" fill="#134e4a">被裁掉一次，她在同类情境里就会重新演一遍。</text>
  </g>

  <!-- ============ 图注（与上图留足间距） ============ -->
  <line x1="48" y1="1068" x2="1352" y2="1068" stroke="#e5e7eb"/>

  <text x="48" y="1100" font-size="12.5" fill="#9ca3af">理论出处：五步循环 ← Kolb 经验学习圈（1984）＋ Piaget 失衡（1936）；四个阶段 ← Bowlby 依恋理论（1969）／ Erikson 心理社会发展（1950）</text>
  <text x="48" y="1122" font-size="12.5" fill="#9ca3af">矛盾与改写 ← Festinger 认知失调（1957）＋ Bartlett 重构记忆（1932）；疤与代价与立场 ← Dewey 经验连续性（1938）＋ Schön 反思性实践（1983）</text>
  <text x="48" y="1144" font-size="12.5" fill="#9ca3af">诚实说明：这是借这些理论当设计骨架，不是在做心理学实验；图中每个机制都能在事件流里找到对应记录，不是估的。</text>
</svg>
